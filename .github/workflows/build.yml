name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools and platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Point build script at the CI SDK
        run: |
          # build_apk.sh expects the SDK at /var/tmp/aosdk; symlink the runner's SDK there
          sudo mkdir -p /var/tmp
          sudo ln -sfn "$ANDROID_SDK_ROOT" /var/tmp/aosdk
          # the script hardcodes the JDK path too — point it at the runner JDK
          sudo mkdir -p /var/tmp/jdk17/bin
          for b in java javac keytool; do
            sudo ln -sfn "$(command -v $b)" "/var/tmp/jdk17/bin/$b"
          done
          ls -la /var/tmp/aosdk/build-tools/

      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair -storetype JKS -keystore keystore.jks \
            -storepass nitrodrive -keypass nitrodrive \
            -alias nitro -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Build, OU=Games, O=Nitro Drive, C=IN"

      - name: Build
        run: bash tools/build_apk.sh

      - name: Verify APK
        run: bash tools/verify_apk.sh NitroDrive.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NitroDrive-apk
          path: NitroDrive.apk
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screens/*.png
          if-no-files-found: warn
