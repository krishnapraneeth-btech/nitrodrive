name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The hosted runner ships an Android SDK at $ANDROID_SDK_ROOT.
      # No setup-android action needed (it fails on its license step).
      - name: Install build-tools and platform
        run: |
          echo "SDK: $ANDROID_SDK_ROOT"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "--- build-tools ---"
          ls "$ANDROID_SDK_ROOT/build-tools/"
          echo "--- platform ---"
          ls "$ANDROID_SDK_ROOT/platforms/"

      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair -storetype JKS -keystore keystore.jks \
            -storepass nitrodrive -keypass nitrodrive \
            -alias nitro -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Build, OU=Games, O=Nitro Drive, C=IN"

      - name: Build
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: bash tools/build_apk.sh

      - name: Verify APK
        run: bash tools/verify_apk.sh NitroDrive.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NitroDrive-apk
          path: NitroDrive.apk
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screens/*.png
          if-no-files-found: warn
