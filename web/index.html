html,body{margin:0;padding:0;height:100%;background:#05070F;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070F;}
canvas{display:block;outline:none;}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:#05070F;color:#fff;font-family:sans-serif;text-align:center;gap:14px;z-index:9}
#rot svg{animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:landscape) and (max-height:520px){#rot{display:flex}}

<script>

// ---------- tiny platform shims ----------
var CENTER='center', LEFT='left', RIGHT='right';
function nowMs(){ return performance.now(); }
function Random2(){ this._s = 123456789; }
Random2.prototype.setSeed=function(v){ this._s=v>>>0; };
Random2.prototype._n=function(){ this._s=(this._s*1664525+1013904223)>>>0; return this._s/4294967296; };
Random2.prototype.nextFloat=function(){ return this._n(); };
Random2.prototype.nextBoolean=function(){ return this._n()>0.5; };
Random2.prototype.nextInt=function(n){ return Math.floor(this._n()*n); };
Random2.prototype.nextDouble=function(){ return this._n(); };
function hexColor(c){ return '#'+('000000'+((c>>>0)&0xFFFFFF).toString(16)).slice(-6); }
function rgba(c,a){ c=c>>>0; a=Math.max(0,Math.min(255,a|0)); return 'rgba('+((c>>16)&255)+','+((c>>8)&255)+','+(c&255)+','+(a/255)+')'; }
function dateStr(){ var d=new Date(); return ''+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2); }

var CTX=null;
function Paint2(){ this.color=0xFF000000; this.style='fill'; this.sw=1; this.shader=null; this.a=255; this.tf=null; this.ts=16; this.align='left'; this.cap='butt'; this.ls=0; }
Paint2.prototype.setColor=function(c){ this.color=c>>>0; this.a=(this.color>>>24)&255; };
Paint2.prototype.setStyle=function(s){ this.style=s; };
Paint2.prototype.setStrokeWidth=function(w){ this.sw=w; };
Paint2.prototype.setShader=function(s){ this.shader=s; };
Paint2.prototype.setAlpha=function(a){ this.a=a; };
Paint2.prototype.setStrokeCap=function(c){ this.cap=c; };
Paint2.prototype.setTypeface=function(f){ this.tf=f; };
Paint2.prototype.setTextSize=function(s){ this.ts=s; };
Paint2.prototype.setTextAlign=function(a){ this.align=a; };
Paint2.prototype.setLetterSpacing=function(l){ this.ls=l; };
Paint2.prototype.setShadowLayer=function(r,dx,dy,c){ this.shadowR=r; this.shadowC=c; };
Paint2.prototype.clearShadowLayer=function(){ this.shadowR=0; this.shadowC=null; };
Paint2.prototype.measureText=function(s){ applyFont(this); return CTX.measureText(s).width; };

function applyFont(p){
  var fam = p.tf ? p.tf.css : "'NRDBold',sans-serif";
  CTX.font = (p.style==='stroke'?'':'') + p.ts + 'px ' + fam;
  CTX.textAlign = p.align;
  CTX.letterSpacing = (p.ls*p.ts)+'px';
}
function applyColor(p){
  if (p.shader && p.shader.g) { CTX.fillStyle = p.shader.g; CTX.strokeStyle = p.shader.g; return; }
  CTX.fillStyle = rgba(p.color, p.a);
  CTX.strokeStyle = rgba(p.color, p.a);
}
function applyPaint(p){
  applyColor(p);
  CTX.lineWidth = Math.max(0.5, p.sw);
  CTX.lineCap = p.cap;
  if (p.shadowR>0){ CTX.shadowColor = hexColor(p.shadowC); CTX.shadowBlur = p.shadowR; }
  else { CTX.shadowBlur = 0; CTX.shadowColor='transparent'; }
}
function Path2(){ this.p = new Path2D(); }
Path2.prototype.reset=function(){ this.p=new Path2D(); };
Path2.prototype.moveTo=function(x,y){ this.p.moveTo(x,y); };
Path2.prototype.lineTo=function(x,y){ this.p.lineTo(x,y); };
Path2.prototype.quadTo=function(x1,y1,x2,y2){ this.p.quadraticCurveTo(x1,y1,x2,y2); };
Path2.prototype.cubicTo=function(x1,y1,x2,y2,x3,y3){ this.p.bezierCurveTo(x1,y1,x2,y2,x3,y3); };
Path2.prototype.close=function(){ this.p.closePath(); };

function LinearGradient2(x0,y0,x1,y1,c0,c1){ this.g = CTX.createLinearGradient(x0,y0,x1,y1); this.g.addColorStop(0, rgba(c0,(c0>>>24)&255)); this.g.addColorStop(1, rgba(c1,(c1>>>24)&255)); }
function RadialGradient2(x,y,r,c0,c1){ this.g = CTX.createRadialGradient(x,y,0,x,y,Math.max(0.1,r)); this.g.addColorStop(0, rgba(c0,(c0>>>24)&255)); this.g.addColorStop(1, rgba(c1,(c1>>>24)&255)); }
function Shader(){}

function Canvas2(){
  this._stack=[];
}
Canvas2.prototype.save=function(){ CTX.save(); };
Canvas2.prototype.restore=function(){ CTX.restore(); };
Canvas2.prototype.translate=function(x,y){ CTX.translate(x,y); };
Canvas2.prototype.rotate=function(a,cx,cy){ if (cx===undefined){ CTX.rotate(a*Math.PI/180); } else { CTX.translate(cx,cy); CTX.rotate(a*Math.PI/180); CTX.translate(-cx,-cy); } };
Canvas2.prototype.scale=function(sx,sy,cx,cy){ if (cx===undefined){ CTX.scale(sx,sy); } else { CTX.translate(cx,cy); CTX.scale(sx,sy); CTX.translate(-cx,-cy); } };
Canvas2.prototype.skew=function(sx,sy){ CTX.transform(1, Math.tan(sy), Math.tan(sx), 1, 0, 0); };
Canvas2.prototype.drawRect=function(l,t,r,b,p){ applyPaint(p); CTX.fillRect(l,t,r-l,b-t); };
Canvas2.prototype.drawRoundRect=function(l,t,r,b,rx,ry,p){ applyPaint(p); CTX.beginPath(); CTX.roundRect(l,t,r-l,b-t,Math.min(rx,ry)); if (p.style==='stroke') CTX.stroke(); else CTX.fill(); };
Canvas2.prototype.drawCircle=function(x,y,r,p){ applyPaint(p); CTX.beginPath(); CTX.arc(x,y,Math.max(0.01,r),0,6.283185307); if (p.style==='stroke') CTX.stroke(); else CTX.fill(); };
Canvas2.prototype.drawOval=function(l,t,r,b,p){ applyPaint(p); CTX.beginPath(); CTX.ellipse((l+r)/2,(t+b)/2,Math.max(0.01,(r-l)/2),Math.max(0.01,(b-t)/2),0,0,6.283185307); if (p.style==='stroke') CTX.stroke(); else CTX.fill(); };
Canvas2.prototype.drawArc=function(l,t,r,b,s0,sw,uc,p){ applyPaint(p); CTX.beginPath(); CTX.ellipse((l+r)/2,(t+b)/2,Math.max(0.01,(r-l)/2),Math.max(0.01,(b-t)/2),0, s0*Math.PI/180, (s0+sw)*Math.PI/180); CTX.stroke(); };
Canvas2.prototype.drawPath=function(path,p){ applyPaint(p); if (p.style==='stroke') CTX.stroke(path.p); else CTX.fill(path.p); };
Canvas2.prototype.drawLine=function(x0,y0,x1,y1,a,b){ applyPaint(a); CTX.beginPath(); CTX.moveTo(x0,y0); CTX.lineTo(x1,y1); CTX.stroke(); };
Canvas2.prototype.drawText=function(str,x,y,p){ applyFont(p); applyPaint(p); if (p.style==='stroke') CTX.strokeText(str,x,y); else CTX.fillText(str,x,y); CTX.letterSpacing='0px'; };

}

World.resize = function(w, h) {
        World.W = w; World.H = h;
        World.laneW = World.W / (LANES + 0.7);
        World.roadL = (World.W - World.laneW * LANES) / 2;
        World.roadR = World.roadL + World.laneW * LANES;
        World.horizonY = World.H * 0.30;
        World.py = World.H * 0.805;
        rnd.setSeed(20261124);
        for (var i = 0; i < 26; i++) {
            bldW[i] = World.W * (0.06 + rnd.nextFloat() * 0.09);
            bldX[i] = rnd.nextFloat() * World.W * 1.3 - World.W * 0.15;
            bldH[i] = World.H * (0.08 + rnd.nextFloat() * 0.19);
            bldC[i] = 0xFF11162B + ((rnd.nextInt(3) - 1) * 0x000A0A0A);
            bldWin[i] = rnd.nextInt(1000);
        }
        for (var i = 0; i < 30; i++) {
            bldW2[i] = World.W * (0.045 + rnd.nextFloat() * 0.075);
            bldX2[i] = rnd.nextFloat() * World.W * 1.3 - World.W * 0.15;
            bldH2[i] = World.H * (0.07 + rnd.nextFloat() * 0.17);
            bldC2[i] = 0xFF0B0F1E;
        }
        for (var i = 0; i < 50; i++) {
            starX[i] = rnd.nextFloat() * World.W; starY[i] = rnd.nextFloat() * World.horizonY * 0.9;
            starP[i] = rnd.nextFloat() * 6.28;
        }
    };

World.start = function() {
        World.over = false; World.wrecked = false; World.overNotified = false; World.paused = false;
        World.level = 1; World.levelDist = 0; World.levelGoal = 5200; World.meters = 0;
        World.speedPx = 520; World.speedKmh = 90; World.score = 0;
        World.carIdx = Math.trunc(Store.selectedCar);
        World.carCol = Store.carColors(World.carIdx, Store.selectedSkin);
        World.lives = 3 + (Store.upgArmor >= 4 ? 1 : 0);
        World.invuln = 1.2; World.nitro = Store.upgNitro >= 5 ? 0.35 : 0.2;
        World.nitroActive = false; World.nitroT = 0;
        World.coinRun = 0; World.passRun = 0; World.nearRun = 0; World.nitroUses = 0; World.levelsDone = 0; World.totalEarned = 0;
        World.coinMul = 1; World.coinMulT = 0; World.magnetT = 0; World.shieldT = 0; World.comboShown = 0; World.comboT = 0;
        World.carLane = 2; World.carLaneVis = 2; World.tilt = 0; World.tick = 0; World.bannerT = 0; World.bannerBig = 0;
        for (var i = 0; i < MAXT; i++) tOn[i] = false;
        for (var i = 0; i < MAXC; i++) cOn[i] = false;
        for (var i = 0; i < MAXP; i++) pOn[i] = false;
        for (var i = 0; i < MAXPART; i++) paL[i] = 0;
        for (var i = 0; i < MAXTXT; i++) txL[i] = 0;
        World.TH = Store.theme(World.level);
        World.spawnAcc = 0; World.gapBase = 620; World.nextType = 0;
        World.banner("GO!", 1.0, true);
        Sfx.goSfx();
    };

World.tapLane = function(right) {
        if (World.over || World.crashed()) return;
        var nl = Draw.clamp(World.carLane + (right ? 1 : -1), 0, LANES - 1);
        if (nl != World.carLane) { World.carLane = nl; World.gv.haptic(8); }
    };

World.steerTo = function(lane) { World.carLane = Draw.clamp(lane, 0, LANES - 1); }

World.crashed = function() { return World.wrecked; }

World.tOnPublic = function(i) { return tOn[i]; }

World.laneOf = function(i) { return tLane[i]; }

World.yOf = function(i) { return tY[i]; }

World.horizon = function() { return World.horizonY; }

World.playerY = function() { return World.py; }

World.laneWidth = function() { return World.laneW; }

World.combo = function() { return World.comboShown; }

World.speedBase = function() {
        return (430 + Store.upgSpeed * 26) * Store.CARS[World.carIdx].topSpeedMul;
    };

World.update = function(dt) {
        if (World.over) { World.updateParticles(dt, true); return; }
        if (World.paused) return;
        World.tick += dt;
        World.TH = Store.theme(World.level);
        if (World.bannerT > 0) World.bannerT -= dt;

        var target = World.speedBase() + Math.min(World.level, 40) * 14;
        if (World.nitroActive) target *= 1.55;
        World.speedPx += (target - World.speedPx) * Math.min(1, dt * (World.nitroActive ? 3.2 : 1.4));
        World.speedKmh = 40 + World.speedPx * 0.145;
        if (World.meters < 1) World.speedKmh = Math.max(World.speedKmh, 80);
        World.meters += World.speedPx * dt * 0.06;
        World.score += (World.speedPx * dt * 0.06 * (World.nitroActive ? 3 : 1) * (1 + World.comboShown * 0.05));
        World.levelDist += World.speedPx * dt;

        var steer = Store.CARS[World.carIdx].handling;
        World.carLaneVis += (World.carLane - World.carLaneVis) * Math.min(1, dt * 11 * steer);
        World.tilt += ((World.carLane - World.carLaneVis) * 0.16 - World.tilt) * Math.min(1, dt * 10);
        if (World.invuln > 0) World.invuln -= dt;
        if (World.comboT > 0) { World.comboT -= dt; if (World.comboT <= 0) { World.comboShown = 0; World.comboMax = 0; } }

        if (World.nitroActive) {
            World.nitro -= dt * 0.30;
            World.nitroT -= dt;
            if (World.nitro <= 0 || World.nitroT <= 0) { World.nitroActive = false; }
            if (rnd.nextFloat() < 0.9) World.addParticle(World.playerX() + (rnd.nextFloat() - 0.5) * World.laneW * 0.7,
                    World.py + World.laneW * 0.5, (rnd.nextFloat() - 0.5) * 60, 320 + rnd.nextFloat() * 200,
                    rnd.nextFloat() * 0.4 + 0.2, 0xFF37E9FF, World.laneW * 0.05, 0);
        } else {
            World.nitro = Math.min(1, World.nitro + dt * 0.028);
        }

        if (World.magnetT > 0) World.magnetT -= dt;
        if (World.shieldT > 0) World.shieldT -= dt;
        if (World.coinMulT > 0) { World.coinMulT -= dt; if (World.coinMulT <= 0) World.coinMul = 1; }
        if (World.crashShake > 0) World.crashShake -= dt * 2.2;

        World.gapBase = Math.max(360, 800 - World.level * 22);
        World.spawnAcc += World.speedPx * dt;
        while (World.spawnAcc > World.gapBase) {
            World.spawnAcc -= World.gapBase;
            World.spawnRow();
        }

        var scroll = World.speedPx * dt;
        World.scrollFar += scroll * 0.06;
        World.scrollMid += scroll * 0.14;
        World.dashOff += scroll;
        World.stripeOff += scroll * 1.2;
        World.sideOff += scroll;

        for (var i = 0; i < MAXT; i++) {
            if (!tOn[i]) continue;
            var dy = scroll * (1 - tRel[i]);
            tY[i] += dy;
            if (tType[i] == 2 && rnd.nextFloat() < dt * 0.35) {
                tLane[i] = Draw.clamp(tLane[i] + (rnd.nextBoolean() ? 1 : -1) * 0, 0, LANES - 1);
            }
            var scaleAt = World.depth(tY[i]);
            var carW2 = World.laneW * 0.80 * scaleAt;
            var carL2 = carW2 * 1.85;

            if (!tPass[i] && tY[i] > World.py + carL2 * 0.1) {
                tPass[i] = true;
                if (Math.abs(tLane[i] - World.carLaneVis) < 1.05) {
                    World.nearRun++;
                    World.score += 60;
                    World.addText("NEAR MISS!", World.playerX(), World.py - 10, 0xFF7CE7FF);
                    Sfx.nearSfx();
                    World.comboInc();
                    World.addScoreCoins(0);
                } else {
                    World.passRun++;
                    World.score += 25;
                }
            }

            if (!World.over && !World.nitroActive && tY[i] > World.py - carL2 * 0.62 && tY[i] < World.py + carL2 * 0.62
                    && Math.abs(tLane[i] - World.carLaneVis) < 0.54) {
                if (World.invuln <= 0) World.hitTraffic(i);
            }
            if (tY[i] > World.H + carL2) tOn[i] = false;
        }

        for (var i = 0; i < MAXC; i++) {
            if (!cOn[i]) continue;
            cY[i] += scroll;
            cSpin[i] += dt * 6;
            var mag = World.magnetT > 0;
            if (mag) {
                var dx = (World.carLaneVis - cLane[i]) * World.laneW;
                var dyy = cY[i] - World.py;
                var d = Math.sqrt(dx * dx + dyy * dyy);
                if (d < World.laneW * 6) {
                    cLane[i] += (World.carLaneVis - cLane[i]) * Math.min(1, dt * 4.5);
                    cY[i] += (World.py - cY[i]) * Math.min(1, dt * 3.2);
                }
            }
            if (Math.abs(cLane[i] - World.carLaneVis) < 0.55 + (mag ? 3.5 : 0) && Math.abs(cY[i] - World.py) < World.laneW * (mag ? 3.2 : 0.55)) {
                cOn[i] = false;
                var v = World.coinMul;
                World.coinRun += v;
                World.totalEarned += v;
                World.score += 15 * v;
                Sfx.coinSfx();
                World.gv.haptic(4);
                World.addParticle(World.cX(cLane[i], World.py), World.py, 0, -80, 0.4, 0xFFFFD24D, World.laneW * 0.07, 1);
                World.comboInc();
                if (World.comboShown > 0 && World.comboShown % 5 == 0) World.addScoreCoins(20 * v);
            }
            if (cY[i] > World.H + 60) cOn[i] = false;
        }

        for (var i = 0; i < MAXP; i++) {
            if (!pOn[i]) continue;
            pY[i] += scroll;
            if (Math.abs(pLane[i] - World.carLaneVis) < 0.66 && Math.abs(pY[i] - World.py) < World.laneW * 0.7) {
                pOn[i] = false;
                World.applyPickup(pType[i]);
            }
            if (pY[i] > World.H + 80) pOn[i] = false;
        }

        if (World.levelDist >= World.levelGoal) {
            World.levelDist -= World.levelGoal;
            World.level++;
            World.levelsDone++;
            World.levelGoal = 4600 + World.level * 950;
            var bonus = 40 + World.level * 30;
            World.coinRun += bonus;
            World.totalEarned += bonus;
            World.score += 400 * World.level;
            Sfx.levelUpPlay();
            World.gv.haptic(30);
            World.banner("LEVEL " + World.level, 1.6, true);
            if (World.level % 3 == 0 && World.lives < 2 + (Store.upgArmor >= 4 ? 1 : 0)) {
                World.lives++;
                World.addText("+1 SPARE", World.playerX(), World.py - World.laneW, 0xFF6BFF9C);
            }
            World.addBurst(World.W / 2, World.H * 0.42, World.TH.neon, 26);
        }

        World.updateParticles(dt, false);
        if (World.over && !World.overNotified) { World.overNotified = true; World.gv.onRunOver(); }
    };

World.hitTraffic = function(i) {
        tOn[i] = false;
        if (World.shieldT > 0) {
            World.shieldT = 0;
            World.invuln = 1.4;
            Sfx.shieldSfx();
            World.banner("SHIELD SAVED YOU", 1.2, false);
            World.addBurst(World.cX(tLane[i], World.py), World.py, 0xFF7CE7FF, 18);
            World.gv.haptic(18);
            return;
        }
        World.lives--;
        Sfx.crashSfx();
        World.gv.haptic(120);
        World.crashShake = 1;
        World.addBurst(World.playerX(), World.py, 0xFFFF8A50, 26);
        World.addBurst(World.playerX(), World.py, 0xFFFFE14D, 16);
        World.speedPx *= 0.34;
        World.comboShown = 0; World.comboT = 0;
        if (World.lives <= 0) {
            World.wrecked = true;
            World.over = true;
            for (var k = 0; k < 4; k++) World.addBurst(World.playerX() + (rnd.nextFloat() - 0.5) * World.laneW, World.py, k % 2 == 0 ? 0xFFFF6B3D : 0xFFFFE14D, 20);
        } else {
            World.invuln = 2.0;
            World.banner(World.lives == 1 ? "DAMAGE! LAST CHANCE" : "DAMAGE!", 1.1, false);
        }
    };

World.applyPickup = function(t) {
        switch (t) {
            case 0:
                World.nitro = Math.min(1, World.nitro + 0.5);
                World.banner("NITRO +50%", 0.9, true);
                Sfx.powerSfx();
                break;
            case 1:
                World.magnetT = 7;
                World.banner("COIN MAGNET", 1.0, true);
                Sfx.powerSfx();
                break;
            case 2:
                World.shieldT = 9;
                World.banner("SHIELD UP", 1.0, true);
                Sfx.shieldSfx();
                break;
            case 3:
                World.coinMul = 2;
                World.coinMulT = 8;
                World.banner("DOUBLE COINS", 1.0, true);
                Sfx.powerSfx();
                break;
            default:
                World.coinRun += 60;
                World.totalEarned += 60;
                World.addText("+60", World.playerX(), World.py - 30, 0xFFFFD24D);
                Sfx.coinSfx();
        }
        World.gv.haptic(12);
        World.addBurst(World.playerX(), World.py, World.TH.neon, 16);
    };

World.comboInc = function() {
        if (World.comboT > 0) World.comboShown++; else World.comboShown = 1;
        World.comboT = 2.6;
        World.comboMax = Math.max(World.comboMax, World.comboShown);
        if (World.comboShown == 5 || World.comboShown == 10 || World.comboShown == 20 || (World.comboShown > 20 && World.comboShown % 10 == 0)) {
            if (World.comboShown <= 20) World.addText("COMBO x" + World.comboShown + "!", World.W / 2, World.py - World.laneW * 1.6, 0xFFFFE14D);
            World.addScoreCoins(World.comboShown * 3);
        }
    };

World.addScoreCoins = function(n) {
        World.coinRun += n;
        World.totalEarned += n;
    };

World.spawnRow = function() {
        var roll = rnd.nextFloat();
        var lvl = Math.min(World.level, 30);
        if (roll < 0.20) { World.spawnCoins(); return; }
        if (roll < 0.30 && World.level >= 3) { World.spawnPickup(); return; }
        if (roll < 0.40 && World.level >= 7) { World.spawnDouble(); return; }
        World.spawnCarRow(roll < 0.86 ? 1 : 2, lvl);
    };

World.freeLane = function() { return rnd.nextInt(LANES); }

World.spawnCarRow = function(count, lvl) {
        var free = World.freeLane();
        var t = 0;
        var truck = rnd.nextFloat() < (0.10 + lvl * 0.008);
        for (var i = 0; i < MAXT && t < count; i++) {
            if (tOn[i]) continue;
            var lane = rnd.nextInt(LANES);
            if (lane == free) continue;
            var spawnY = -World.laneW * (2.2 + rnd.nextFloat() * 1.4);
            if (World.laneBusy(lane, spawnY) || World.laneBusy(lane, spawnY - World.laneW * 3)) continue;
            tOn[i] = true;
            tLane[i] = lane;
            tY[i] = -World.laneW * (2.2 + rnd.nextFloat() * 1.4);
            tRel[i] = truck ? 0.42 + rnd.nextFloat() * 0.15 : 0.35 + rnd.nextFloat() * 0.42;
            tType[i] = truck ? 1 : (rnd.nextFloat() < 0.14 ? 2 : 0);
            tCol[i] = 0xFF000000 | (0x30 + rnd.nextInt(0xC0)) << 16 | (0x20 + rnd.nextInt(0xA0)) << 8 | (0x30 + rnd.nextInt(0xC0));
            if (tType[i] == 2) tCol[i] = 0xFFF5F7FA;
            tPass[i] = false;
            tScale[i] = truck ? 1.35 : 1;
            t++;
        }
    };

World.spawnDouble = function() {
        var l1 = rnd.nextInt(LANES);
        var l2 = rnd.nextInt(LANES);
        if (l1 == l2) return;
        World.spawnAt(l1, 1); World.spawnAt(l2, 0);
    };

World.laneBusy = function(lane, y) {
        for (var j = 0; j < MAXT; j++) {
            if (tOn[j] && Math.abs(tLane[j] - lane) < 0.9 && Math.abs(tY[j] - y) < World.laneW * 2.8) return true;
        }
        return false;
    };

World.spawnAt = function(lane, type) {
        if (World.laneBusy(lane, -World.laneW * 2.6)) return;
        for (var i = 0; i < MAXT; i++) {
            if (tOn[i]) continue;
            tOn[i] = true;
            tLane[i] = lane;
            tY[i] = -World.laneW * (2.2 + rnd.nextFloat());
            tRel[i] = type == 1 ? 0.55 : 0.4 + rnd.nextFloat() * 0.3;
            tType[i] = type;
            tCol[i] = 0xFF000000 | (0x30 + rnd.nextInt(0xC0)) << 16 | (0x20 + rnd.nextInt(0xA0)) << 8 | (0x30 + rnd.nextInt(0xC0));
            tPass[i] = false;
            tScale[i] = type == 1 ? 1.35 : 0.9;
            return;
        }
    };

World.spawnCoins = function() {
        var lane = rnd.nextInt(LANES);
        var n = 4 + rnd.nextInt(4);
        var arc = rnd.nextBoolean();
        var startY = -World.laneW * 2.5;
        var placed = 0;
        for (var i = 0; i < MAXC && placed < n; i++) {
            if (cOn[i]) continue;
            cOn[i] = true;
            cLane[i] = lane + (arc ? Math.sin(placed * 0.9) * 0.8 : 0);
            cY[i] = startY - placed * World.laneW * 0.95;
            cSpin[i] = rnd.nextFloat() * 6;
            cAttract[i] = false;
            placed++;
        }
    };

World.spawnPickup = function() {
        var type = rnd.nextInt(5);
        var lane = rnd.nextInt(LANES);
        for (var i = 0; i < MAXP; i++) {
            if (pOn[i]) continue;
            pOn[i] = true;
            pLane[i] = lane;
            pY[i] = -World.laneW * 3;
            pType[i] = type;
            return;
        }
    };

World.addParticle = function(x, y, vx, vy, life, col, size, kind) {
        for (var i = 0; i < MAXPART; i++) {
            if (paL[i] > 0) continue;
            paX[i] = x; paY[i] = y; paVX[i] = vx; paVY[i] = vy;
            paL[i] = life; paM[i] = life; paCol[i] = col; paSize[i] = size; paKind[i] = kind;
            return;
        }
    };

World.addBurst = function(x, y, col, n) {
        for (var i = 0; i < n; i++) {
            var a = rnd.nextFloat() * 6.283;
            var sp = 120 + rnd.nextFloat() * 340;
            World.addParticle(x, y, Math.cos(a) * sp, Math.sin(a) * sp,
                    0.35 + rnd.nextFloat() * 0.5, col, World.laneW * (0.02 + rnd.nextFloat() * 0.05), 0);
        }
    };

World.addText = function(s, x, y, col) {
        for (var i = 0; i < MAXTXT; i++) {
            if (txL[i] > 0) continue;
            txS[i] = s; txX[i] = x; txY[i] = y; txL[i] = 1.1; txCol[i] = col;
            return;
        }
    };

World.updateParticles = function(dt, frozen) {
        for (var i = 0; i < MAXPART; i++) {
            if (paL[i] <= 0) continue;
            paL[i] -= dt;
            paX[i] += paVX[i] * dt;
            paY[i] += paVY[i] * dt;
            paVY[i] += 260 * dt;
            paVX[i] *= (1 - dt * 1.5);
        }
        if (frozen) return;
        for (var i = 0; i < MAXTXT; i++) {
            if (txL[i] <= 0) continue;
            txL[i] -= dt;
            txY[i] -= 55 * dt;
        }
    };

World.banner = function(s, t, big) { World.bannerText = s; World.bannerT = t; World.bannerBig = big ? 1 : 0; }

World.playerX = function() { return World.cX(World.carLaneVis, World.py); }

World.cX = function(lane, y) {
        var l = World.roadL + World.laneW * (lane + 0.5);
        var k = World.depth(y);
        var center = World.W / 2;
        return center + (l - center) * (0.28 + 0.72 * k);
    };

World.depth = function(y) {
        var d = (y - World.horizonY) / (World.py - World.horizonY);
        d = Draw.clamp(d, 0, 1.25);
        return 0.30 + 0.70 * d;
    };

World.scaleAt = function(y) {
        var d = (y - World.horizonY) / (World.py - World.horizonY);
        return Draw.clamp(d, 0, 1.3);
    };

World.laneWidthAt = function(y) { return World.laneW * (0.28 + 0.72 * World.depth(y)); }

World.draw = function(c) {
        World.drawSky(c);
        World.drawRoad(c);
        for (var i = 0; i < MAXC; i++) if (cOn[i]) World.drawCoin(c, i);
        for (var i = 0; i < MAXT; i++) if (tOn[i]) World.drawTraffic(c, i);
        for (var i = 0; i < MAXP; i++) if (pOn[i]) World.drawPickup(c, i);
        World.drawPlayer(c);
        World.drawParticles(c);
        World.drawTexts(c);
        World.drawVignette(c);
    };

World.drawSky = function(c) {

        Draw.sh(new LinearGradient2(0, 0, 0, World.horizonY * 1.12, World.TH.skyTop, World.TH.skyBot, 'clamp'));
        Draw.p.setStyle('fill');
        c.drawRect(0, 0, World.W, World.horizonY * 1.12, Draw.p);
        Draw.shClear();

        for (var i = 0; i < 50; i++) {
            var tw = 0.3 + 0.7 * Math.abs(Math.sin(World.tick * 1.3 + starP[i]));
            Draw.p.setColor(Draw.alpha(0xFFFFFFFF, Math.trunc((70 * tw))));
            c.drawCircle(starX[i], starY[i], 1.4, Draw.p);
        }

        var ox = World.W * 0.5, oy = World.horizonY * 0.62, orad = World.W * 0.20;
        Draw.sh(new RadialGradient2(ox, oy, orad * 2.6, Draw.alpha(World.TH.neon2, 90), 0x00000000, 'clamp'));
        c.drawCircle(ox, oy, orad * 2.6, Draw.p);
        Draw.shClear();
        Draw.p.setColor(Draw.alpha(World.TH.neon2, 235));
        c.drawCircle(ox, oy, orad, Draw.p);
        Draw.p.setColor(Draw.alpha(World.TH.neon, 200));
        c.drawCircle(ox, oy, orad * 0.72, Draw.p);
        for (var b = 0; b < 5; b++) {
            var by = oy - orad + orad * 0.55 * b + 6;
            Draw.p.setColor(Draw.alpha(World.TH.skyTop, 170));
            c.drawRect(ox - orad, by, ox + orad, by + orad * (0.06 + b * 0.03), Draw.p);
        }

        for (var i = 0; i < 30; i++) {
            var x = World.mod(bldX2[i] - World.scrollMid * 0.35, World.W * 1.3) - World.W * 0.15;
            var top = World.horizonY - bldH2[i] * 0.8;
            Draw.rrect(c, x, top, x + bldW2[i], World.horizonY + 2, 2, bldC2[i]);
            Draw.p.setColor(Draw.alpha(World.TH.neon2, 70));
            c.drawRect(x, top, x + bldW2[i], top + 2, Draw.p);
        }

        for (var i = 0; i < 26; i++) {
            var x = World.mod(bldX[i] - World.scrollMid * 0.9, World.W * 1.3) - World.W * 0.15;
            var top = World.horizonY - bldH[i];
            var bodyCol = Draw.lerpColor(0xFF0A0F1E, World.TH.neon, 0.10 + (bldWin[i] % 5) * 0.02);
            Draw.rrect(c, x, top, x + bldW[i], World.horizonY + 3, 3, bodyCol);

            Draw.p.setColor(0x33000000);
            c.drawRect(x + bldW[i] * 0.62, top, x + bldW[i], World.horizonY + 3, Draw.p);

            Draw.p.setColor(Draw.alpha(World.TH.neon, 200));
            c.drawRect(x, top, x + bldW[i], top + 2.5, Draw.p);

            if (bldWin[i] % 4 == 0) {
                Draw.line(c, x + bldW[i] * 0.5, top, x + bldW[i] * 0.5, top - World.H * 0.022, Draw.alpha(World.TH.neon2, 160), 1.5);
                Draw.p.setColor(Draw.alpha(World.TH.neon2, 220));
                c.drawCircle(x + bldW[i] * 0.5, top - World.H * 0.022, 2.2, Draw.p);
            }

            var seed = bldWin[i];
            var cols = Math.max(2, Math.trunc((bldW[i] / (World.W * 0.020))));
            var rows = Math.max(3, Math.trunc((bldH[i] / (World.H * 0.013))));
            for (var cy = 0; cy < rows; cy++) {
                var lit = (seed + cy * 37) % 10;
                if (lit > 6) continue;
                var col = lit < 3 ? World.TH.neon : (lit < 5 ? World.TH.neon2 : 0xFFFFD27D);
                Draw.p.setColor(Draw.alpha(col, 60 + lit * 16));
                var wy = top + bldH[i] * (cy + 0.5) / rows;
                var wx = x + bldW[i] * 0.08;
                var ww = bldW[i] * 0.84;
                if (lit < 3) c.drawRect(wx, wy, wx + ww, wy + 1.6, Draw.p);
                else {
                    for (var cx = 0; cx < cols; cx++) {
                        if ((seed + cx * 13 + cy * 7) % 3 == 0) continue;
                        var px2 = x + bldW[i] * (cx + 0.5) / cols;
                        c.drawRect(px2 - 1.6, wy - 1.6, px2 + 1.6, wy + 1.6, Draw.p);
                    }
                }
            }
        }

        Draw.sh(new LinearGradient2(0, World.horizonY - World.H * 0.05, 0, World.horizonY + World.H * 0.02,
                Draw.alpha(World.TH.neon, 0), Draw.alpha(World.TH.neon, 70), 'clamp'));
        Draw.p.setStyle('fill');
        c.drawRect(0, World.horizonY - World.H * 0.05, World.W, World.horizonY + World.H * 0.02, Draw.p);
        Draw.shClear();
        Draw.line(c, 0, World.horizonY, World.W, World.horizonY, Draw.alpha(World.TH.neon, 170), 2);
    };

World.drawRoad = function(c) {

        Draw.sh(new LinearGradient2(0, World.horizonY, 0, World.H, World.TH.ground2, World.TH.ground1, 'clamp'));
        Draw.p.setStyle('fill');
        c.drawRect(0, World.horizonY, World.W, World.H, Draw.p);
        Draw.shClear();

        for (var side = 0; side < 2; side++) {
            for (var k = 0; k < 6; k++) {
                var phase = ((World.sideOff * 0.0018 + k / 6 + side * 0.11) % 1);
                var y = World.horizonY + (World.H - World.horizonY) * phase * phase;
                var scl = 0.28 + 0.72 * World.depth(y);
                var bwid = World.W * 0.20 * scl;
                var bhei = Math.min(World.W * 0.42 * scl, y - World.horizonY - 2);
                if (bhei < 6) continue;
                var bx = side == 0 ? World.roadL - bwid * 0.42 : World.roadR + bwid * 0.42;
                Draw.rrect(c, bx - bwid / 2, y - bhei, bx + bwid / 2, y, World.W * 0.014 * scl,
                        Draw.lerpColor(0xFF0C1120, World.TH.neon, 0.06));
                Draw.p.setColor(Draw.alpha(World.TH.neon2, Math.trunc((30 + 120 * scl))));
                c.drawRect(bx - bwid * 0.44, y - bhei, bx + bwid * 0.44, y - bhei + Math.max(1.5, 3 * scl), Draw.p);
                Draw.p.setColor(Draw.alpha(World.TH.neon, Math.trunc((26 + 80 * scl))));
                for (var wv = 0; wv < 4; wv++) {
                    var wy = y - bhei * (0.16 + wv * 0.22);
                    c.drawRect(bx - bwid * 0.32, wy, bx + bwid * 0.32, wy + Math.max(1, 2.6 * scl), Draw.p);
                }
            }
        }

        Draw.path.reset();
        var tl = World.W / 2 + (World.roadL - World.W / 2) * 0.28, tr = World.W / 2 + (World.roadR - World.W / 2) * 0.28;
        Draw.path.moveTo(tl, World.horizonY);
        Draw.path.lineTo(tr, World.horizonY);
        Draw.path.lineTo(World.roadR, World.H);
        Draw.path.lineTo(World.roadL, World.H);
        Draw.path.close();
        Draw.sh(new LinearGradient2(0, World.horizonY, 0, World.H, 0xFF1B2334, 0xFF0B0E16, 'clamp'));
        Draw.p.setColor(0xFF000000);
        c.drawPath(Draw.path, Draw.p);
        Draw.shClear();

        for (var k = 0; k < 5; k++) {
            var phase = ((World.dashOff * 0.0011 + k / 5) % 1);
            var y = World.horizonY + (World.H - World.horizonY) * phase * phase;
            if (y < World.horizonY + World.H * 0.05) continue;
            var rr = World.laneW * 2.2 * World.depth(y);
            Draw.sh(new RadialGradient2(World.W / 2, y, rr, Draw.alpha(0xFF9FD8FF, Math.trunc((26 * World.depth(y)))), 0x00000000, 'clamp'));
            c.drawRect(0, y - rr, World.W, y + rr, Draw.p);
            Draw.shClear();
        }

        for (var l = 1; l < LANES; l++) {
            for (var k = 0; k < 26; k++) {
                var phase = (World.dashOff * 0.00085 + k / 26) % 1;
                var yb = World.horizonY + (World.H - World.horizonY) * phase * phase;
                var yt = yb - (10 + 60 * phase * phase);
                if (yb < World.horizonY + 8) continue;
                var xb = World.W / 2 + (World.roadL + World.laneW * l - World.W / 2) * (0.28 + 0.72 * World.depth(yb));
                var xt = World.W / 2 + (World.roadL + World.laneW * l - World.W / 2) * (0.28 + 0.72 * World.depth(yt));
                Draw.s.setStyle('fill');
                Draw.s.setShader(null);
                Draw.s.setColor(Draw.alpha(0xFFCFE6FF, Math.trunc((60 + 150 * phase))));
                Draw.s.setStrokeWidth(Math.max(1.6, 5 * World.depth(yb)));
                c.drawLine(xt, yt, xb, yb, Draw.s);
            }
        }

        for (var side = 0; side < 2; side++) {
            var xe = side == 0 ? World.roadL : World.roadR;
            var xt = World.W / 2 + (xe - World.W / 2) * 0.28;
            var edgeCol = side == 0 ? World.TH.neon : World.TH.neon2;
            Draw.s.setStyle('stroke');
            Draw.s.setShader(null);
            Draw.s.setColor(Draw.alpha(edgeCol, 55));
            Draw.s.setStrokeWidth(World.W * 0.030);
            c.drawLine(xt, World.horizonY, xe, World.H, Draw.s);
            Draw.s.setColor(edgeCol);
            Draw.s.setStrokeWidth(World.W * 0.007);
            c.drawLine(xt, World.horizonY, xe, World.H, Draw.s);
            Draw.s.setColor(0xCCFFFFFF);
            Draw.s.setStrokeWidth(World.W * 0.0022);
            c.drawLine(xt, World.horizonY, xe, World.H, Draw.s);
            for (var k = 0; k < 9; k++) {
                var phase = ((World.sideOff * 0.0013 + k / 9) % 1);
                var y = World.horizonY + (World.H - World.horizonY) * phase * phase;
                if (y < World.horizonY + 12) continue;
                var x = World.W / 2 + (xe - World.W / 2) * (0.28 + 0.72 * World.depth(y));
                var r = World.W * 0.007 * World.depth(y) * 2.2;

                Draw.line(c, x + (side == 0 ? -1 : 1) * r * 2.4, y, x + (side == 0 ? -1 : 1) * r * 2.4, y - r * 9, Draw.alpha(0xFFFFFFFF, 90), Math.max(1, r * 0.5));
                Draw.p.setColor(Draw.alpha(0xFFDFF6FF, 200));
                c.drawCircle(x + (side == 0 ? -1 : 1) * r * 2.4, y - r * 9, Math.max(1.2, r * 1.1), Draw.p);
                Draw.sh(new RadialGradient2(x + (side == 0 ? -1 : 1) * r * 2.4, y - r * 9, r * 6, 0x33DFF6FF, 0x00000000, 'clamp'));
                c.drawCircle(x + (side == 0 ? -1 : 1) * r * 2.4, y - r * 9, r * 6, Draw.p);
                Draw.shClear();

                Draw.p.setColor(Draw.alpha(edgeCol, 70));
                c.drawCircle(x, y, r * 2.6, Draw.p);
                Draw.p.setColor(edgeCol);
                c.drawCircle(x, y, r, Draw.p);
            }
        }
    };

World.drawTraffic = function(c, i) {
        var y = tY[i];
        if (y < World.horizonY + 4) return;
        var sc = World.scaleAt(y) * 0.55 + 0.45 * World.depth(y);
        sc = Draw.clamp(sc / 1.0, 0.02, 1.3);
        var fade = Draw.clamp((y - World.horizonY) / (World.H * 0.10), 0, 1);
        var w = World.laneW * 0.80 * tScale[i] * (0.30 + 0.70 * Draw.clamp((y - World.horizonY) / (World.py - World.horizonY), 0, 1.25));
        var a = Math.trunc((255 * fade));
        var x = World.cX(tLane[i], y);
        if (tType[i] == 1) World.drawTruck(c, x, y, w);
        else if (tType[i] == 2) World.drawPolice(c, x, y, w);
        else CarArt.draw(c, x, y, w, tCol[i], Draw.darken(tCol[i], 0.45), 0xFF222A38, 0, 0, 0, false, 0);
    };

World.drawTruck = function(c, x, y, w) {
        var l = w * 2.5;
        Draw.rrect(c, x - w / 2, y - l / 2, x + w / 2, y + l / 2, w * 0.10, 0xFF23262F);
        Draw.rrect(c, x - w * 0.44, y - l * 0.46, x + w * 0.44, y + l * 0.10, w * 0.06, 0xFF6E7686);
        Draw.rrect(c, x - w * 0.42, y + l * 0.12, x + w * 0.42, y + l * 0.46, w * 0.06, 0xFF3A3F4C);
        Draw.p.setColor(0x33FFFFFF);
        c.drawRect(x - w * 0.36, y + l * 0.16, x + w * 0.36, y + l * 0.20, Draw.p);
        Draw.p.setColor(0xFFFF5A4D);
        c.drawCircle(x - w * 0.30, y + l * 0.44, w * 0.05, Draw.p);
        c.drawCircle(x + w * 0.30, y + l * 0.44, w * 0.05, Draw.p);

        Draw.p.setColor(0x66FFF3C4);
        c.drawCircle(x - w * 0.30, y - l * 0.44, w * 0.16, Draw.p);
        c.drawCircle(x + w * 0.30, y - l * 0.44, w * 0.16, Draw.p);
        Draw.p.setColor(0xFFFFF3C4);
        c.drawRect(x - w * 0.38, y - l * 0.47, x - w * 0.22, y - l * 0.44, Draw.p);
        c.drawRect(x + w * 0.22, y - l * 0.47, x + w * 0.38, y - l * 0.44, Draw.p);

        Draw.p.setColor(0xFF0B0C10);
        c.drawRect(x - w * 0.56, y - l * 0.28, x - w * 0.42, y - l * 0.12, Draw.p);
        c.drawRect(x + w * 0.42, y - l * 0.28, x + w * 0.56, y - l * 0.12, Draw.p);
        c.drawRect(x - w * 0.56, y + l * 0.18, x - w * 0.42, y + l * 0.34, Draw.p);
        c.drawRect(x + w * 0.42, y + l * 0.18, x + w * 0.56, y + l * 0.34, Draw.p);
    };

World.drawPolice = function(c, x, y, w) {
        CarArt.draw(c, x, y, w, 0xFFF2F5FA, 0xFF1B2430, 0xFF2A3A55, 2, 0, 0, false, 0);
        var red = (Math.trunc((World.tick * 8)) % 2) == 0;
        Draw.p.setColor(red ? 0xFFFF2D55 : 0xFF2D6BFF);
        var ly = y - w * 0.42;
        Draw.sh(new RadialGradient2(x - w * 0.12, ly, w * 0.45, red ? 0xAAFF2D55 : 0x00000000, 0x00000000, 'clamp'));
        c.drawCircle(x - w * 0.12, ly, w * 0.45, Draw.p);
        Draw.sh(null);
        Draw.rrect(c, x - w * 0.28, ly - w * 0.03, x - w * 0.02, ly + w * 0.03, 2, red ? 0xFFFF2D55 : 0xFF5A2030);
        Draw.rrect(c, x + w * 0.02, ly - w * 0.03, x + w * 0.28, ly + w * 0.03, 2, red ? 0xFF20305A : 0xFF2D6BFF);
    };

World.drawCoin = function(c, i) {
        var y = cY[i];
        if (y < World.horizonY + 6) return;
        var sc = World.depth(y);
        var r = World.laneW * 0.17 * sc;
        if (r < 1) return;
        Draw.p.setColor(0x44FFD24D);
        c.drawCircle(World.cX(cLane[i], y), y + r * 0.2, r * 1.7, Draw.p);
        Draw.iconCoin(c, World.cX(cLane[i], y), y, r, cSpin[i], 0);
    };

World.drawPickup = function(c, i) {
        var y = pY[i];
        if (y < World.horizonY + 8) return;
        var sc = World.depth(y);
        var r = World.laneW * 0.24 * sc;
        var x = World.cX(pLane[i], y);
        var col = World.pickupColor(pType[i]);
        Draw.p.setColor(Draw.alpha(col, 70));
        c.drawCircle(x, y, r * 1.8, Draw.p);
        Draw.rrect(c, x - r, y - r, x + r, y + r, r * 0.28, 0xDD0B1020);
        Draw.glowRRect(c, x - r, y - r, x + r, y + r, r * 0.28, col, Math.max(1.5, r * 0.09));
        if (pType[i] == 0) Draw.iconBolt(c, x, y, r * 1.3, col);
        else if (pType[i] == 1) Draw.iconStar(c, x, y, r * 0.72, r * 0.3, col);
        else if (pType[i] == 2) Draw.iconShield(c, x, y, r * 1.25, col, true);
        else if (pType[i] == 3) {
            Draw.text(c, "2", x - r * 0.28, y + r * 0.5, r * 1.3, Draw.F_HEAD, col, CENTER);
            Draw.iconCoin(c, x + r * 0.36, y, r * 0.42, World.tick * 4, 0);
        } else Draw.iconGift(c, x, y, r * 1.3, col);
    };

World.pickupColor = function(t) {
        switch (t) { case 0: return 0xFF37E9FF; case 1: return 0xFFFFE14D; case 2: return 0xFF7CFF6B;
            case 3: return 0xFFFF6FD8; default: return 0xFFFFB020; }
    };

World.drawPlayer = function(c) {
        if (World.over) return;
        var x = World.playerX();
        var y = World.py;
        var w = World.laneW * 0.92;
        var blink = World.invuln > 0 && (Math.trunc((World.tick * 12)) % 2 == 0);

        Draw.p.setColor(0x66000000);
        c.drawOval(x - w * 0.62, y - World.laneW * 0.62, x + w * 0.62, y + World.laneW * 0.72, Draw.p);

        if (World.nitroActive) {
            var f = 0.85 + Math.sin(World.tick * 40) * 0.15;
            Draw.sh(new LinearGradient2(0, y + w * 0.55, 0, y + w * 0.55 + World.laneW * 1.1 * f,
                    Draw.alpha(0xFF37E9FF, 200), 0x00FF2E97, 'clamp'));
            Draw.p.setStyle('fill');
            Draw.path.reset();
            Draw.path.moveTo(x - w * 0.24, y + w * 0.5);
            Draw.path.lineTo(x + w * 0.24, y + w * 0.5);
            Draw.path.lineTo(x, y + w * 0.5 + World.laneW * 1.1 * f);
            Draw.path.close();
            c.drawPath(Draw.path, Draw.p);
            Draw.sh(null);
        }

        Draw.sh(new RadialGradient2(x, y, w * 0.95, Draw.alpha(World.carCol[2], 90), 0x00000000, 'clamp'));
        c.drawCircle(x, y, w * 0.95, Draw.p);
        Draw.sh(null);
        if (blink) Draw.p.setAlpha(120);
        CarArt.draw(c, x, y, w, World.carCol[0], World.carCol[1], World.carCol[2], 3, Math.trunc(Store.selectedCar), World.tilt, false, 0);
        if (blink) Draw.p.setAlpha(255);
        if (World.shieldT > 0) {
            var pulse = 0.5 + 0.5 * Math.sin(World.tick * 5);
            Draw.s.setStyle('stroke');
            Draw.s.setColor(Draw.alpha(0xFF7CE7FF, 120 + Math.trunc((80 * pulse))));
            Draw.s.setStrokeWidth(3 + 2 * pulse);
            c.drawCircle(x, y, w * 0.95 + 8 + 4 * pulse, Draw.s);
        }

        var spd01 = Draw.clamp((World.speedKmh - 110) / 130, 0, 1);
        if (spd01 > 0.03 || World.nitroActive) {
            var k = World.nitroActive ? 1 : spd01;
            Draw.s.setStyle('stroke');
            Draw.s.setStrokeWidth(2);
            for (var i = 0; i < 10; i++) {
                var yy = ((World.tick * (700 + World.speedPx) + i * World.H * 0.137) % World.H);
                var xx = World.W * ((i * 0.37) % 1);
                Draw.s.setColor(Draw.alpha(World.nitroActive ? 0xFF37E9FF : 0xFFCFE6FF, Math.trunc((60 * k))));
                c.drawLine(xx, yy, xx, yy + World.H * 0.05 * k, Draw.s);
            }
        }
    };

World.drawParticles = function(c) {
        for (var i = 0; i < MAXPART; i++) {
            if (paL[i] <= 0) continue;
            var f = paL[i] / paM[i];
            Draw.p.setColor(Draw.alpha(paCol[i], Math.trunc((230 * f))));
            c.drawCircle(paX[i], paY[i], paSize[i] * (0.6 + f * 0.8), Draw.p);
            Draw.p.setColor(Draw.alpha(paCol[i], Math.trunc((70 * f))));
            c.drawCircle(paX[i], paY[i], paSize[i] * 2.4 * f, Draw.p);
        }
    };

World.drawTexts = function(c) {
        for (var i = 0; i < MAXTXT; i++) {
            if (txL[i] <= 0) continue;
            var a = Math.min(1, txL[i] / 0.4);
            Draw.textGlow(c, txS[i], txX[i], txY[i], World.W * 0.045, Draw.F_HEAD, Draw.alpha(txCol[i], Math.trunc((255 * a))), Draw.alpha(txCol[i], Math.trunc((140 * a))), 10);
        }
    };

World.drawVignette = function(c) {

World.mod = function(a, m) { a = a % m; return a < 0 ? a + m : a; }

var Game = {};
var Game = {};

    Game.MENU = 0, Game.PLAY = 1, Game.GARAGE = 2, Game.MISSIONS = 3, Game.SETTINGS = 4, Game.GAMEOVER = 5, Game.CREDITS = 6;
    Game.screen = Game.MENU;
    Game.gv = null;
    Game.world = null;
    Game.W = 0;
    Game.H = 0;
    Game.t = 0;
    var rnd = new Random2();

    Game.downX = 0;

    Game.downY = 0;

    Game.toast = null;
    Game.toastT = 0;
    Game.toastCol = 0;

    Game.carPage = 0;

    Game.dailyEarn = new Array(3).fill(0);
    Game.dailyDone = new Array(3).fill(false);
    Game.dailyClaimed = new Array(3).fill(false);
    Game.DAILY_GOAL = [8000, 25, 300];
    Game.DAILY_REW = [150, 150, 200];
    Game.goMenuAfter = false;

    Game.fx = [];

    Game.init = function(p_gv) {
        Game.gv = p_gv;
        Game.world = (World.init(p_gv), World);
    };

Game.resize = function(w, h) {
        Game.W = w;
        Game.H = h;
        Game.world.resize(w, h);
    };

Game.update = function() {
        Game.updateExternal(1 / 60);
        Game.checkDailyReset();
    };

Game.updateExternal = function(dt) {
        dt = Draw.clamp(dt, 0, 0.05);
        Game.t += dt;
        if (Game.toastT > 0) Game.toastT -= dt;
        if (Game.screen == Game.PLAY) {
            Game.world.update(dt);
            Sfx.setEngine(Game.world.speedKmh * 1.1 + (Game.world.nitroActive ? 40 : 0), 0.16 + Game.world.speedKmh / 900);
        } else {
            Sfx.setEngine(60, Game.screen == Game.GAMEOVER ? 0.03 : 0);
        }
        for (var i = Game.fx.length - 1; i >= 0; i--) {
            var f = Game.fx[i];
            f[4] -= dt;
            if (f[4] <= 0) { Game.fx.splice(i,1); continue; }
            f[0] += f[2] * dt;
            f[1] += f[3] * dt;
            f[3] += 320 * dt;
        }
    };

Game.checkDailyReset = function() {
        var today = Store.today();
        if (!today.equals(Store.missionDay)) {
            Store.missionDay = today;
            for (var i = 0; i < 3; i++) { Game.dailyEarn[i] = 0; Game.dailyDone[i] = false; Game.dailyClaimed[i] = false; }
            Store.save();
        }
    };

Game.onDown = function(x, y) { Game.downX = x; Game.downY = y; }

Game.onMove = function(x, y) {
        if (Game.screen == Game.PLAY && !Game.world.over && !Game.world.paused) {
            var dx = x - Game.downX, dy = y - Game.downY;
            if (Math.abs(dx) > Game.W * 0.05 && Math.abs(dx) > Math.abs(dy) * 0.8) {
                Game.world.tapLane(dx > 0);
                Game.downX = x;
            }
        }
    };

Game.onTap = function(x, y) {
        Sfx.clickSfx();
        if (Game.screen == Game.MENU) Game.menuTap(x, y);
        else if (Game.screen == Game.PLAY) Game.playTap(x, y);
        else if (Game.screen == Game.GARAGE) Game.garageTap(x, y);
        else if (Game.screen == Game.MISSIONS) Game.missionTap(x, y);
        else if (Game.screen == Game.SETTINGS) Game.settingsTap(x, y);
        else if (Game.screen == Game.GAMEOVER) Game.overTap(x, y);
        else Game.screen = Game.MENU;
    };

Game.startRun = function() {
        Game.goMenuAfter = false;
        Game.world.start();
        Music.start();
        Game.screen = Game.PLAY;
    };

Game.menuBtnY = function(i) { return Game.H * 0.405 + i * Game.H * 0.102; }

Game.menuBtnH = function(i) { return i == 0 ? Game.H * 0.093 : Game.H * 0.076; }

Game.menuTap = function(x, y) {
        for (var i = 0; i < 4; i++) {
            var by = Game.menuBtnY(i), bh = Game.menuBtnH(i);
            var bw = i == 0 ? Game.W * 0.74 : Game.W * 0.66;
            var bl = (Game.W - bw) / 2;
            if (Game.hit(bl, by, bw, bh, x, y)) {
                if (i == 0) Game.startRun();
                else if (i == 1) { Game.carPage = Math.trunc(Store.selectedCar); Game.screen = Game.GARAGE; }
                else if (i == 2) Game.screen = Game.MISSIONS;
                else Game.screen = Game.SETTINGS;
                return;
            }
        }
        var cy = Game.menuCarY();
        if (Game.hit(Game.W * 0.02, cy - Game.H * 0.04, Game.W * 0.13, Game.H * 0.08, x, y)) { Game.cycleCar(-1); return; }
        if (Game.hit(Game.W * 0.85, cy - Game.H * 0.04, Game.W * 0.13, Game.H * 0.08, x, y)) { Game.cycleCar(1); }
    };

Game.menuCarY = function() { return Game.H * 0.855; }

Game.cycleCar = function(d) {
        Store.selectedCar = ((Store.selectedCar + d) % 6 + 6) % 6;
        if (!Store.unlocked[Math.trunc(Store.selectedCar)]) Game.toast("LOCKED — OPEN GARAGE", 0xFFFF6B6B);
        Store.save();
    };

Game.playTap = function(x, y) {
        if (Game.world.over) return;
        if (Game.world.paused) { Game.pauseTap(x, y); return; }
        if (Game.hit(Game.W * 0.40, 0, Game.W * 0.20, Game.H * 0.095, x, y)) { Game.world.paused = true; return; }
        if (Game.hit(Game.nitroBtnX(), Game.nitroBtnY(), Game.nitroBtnW(), Game.nitroBtnH(), x, y)) { Game.fireNitro(); return; }
        if (y < Game.H * 0.16) return;
        if (x < Game.W * 0.5) Game.world.tapLane(false);
        else Game.world.tapLane(true);
    };

Game.nitroBtnX = function() { return Game.W * 0.05; }

Game.nitroBtnY = function() { return Game.H * 0.865; }

Game.nitroBtnW = function() { return Game.W * 0.37; }

Game.nitroBtnH = function() { return Game.H * 0.078; }

Game.fireNitro = function() {
        if (Game.world.nitroActive) return;
        if (Game.world.nitro < 0.25) { Game.toast("NITRO NOT READY", 0xFFFF6B6B); return; }
        Game.world.nitroActive = true;
        Game.world.nitroT = 0.55 + Game.world.nitro * 1.6;
        Game.world.nitroUses++;
        Sfx.powerSfx();
        Game.gv.haptic(20);
        Game.world.addBurst(Game.world.playerX(), Game.world.playerY(), 0xFF37E9FF, 18);

Game.pauseY = function(i) { return Game.H * 0.40 + i * Game.H * 0.115; }

Game.pauseTap = function(x, y) {
        var bw = Game.W * 0.62, bl = (Game.W - bw) / 2, bh = Game.H * 0.082;
        for (var i = 0; i < 4; i++) {
            if (Game.hit(bl, Game.pauseY(i), bw, bh, x, y)) {
                if (i == 0) Game.world.paused = false;
                else if (i == 1) { Game.world.paused = false; Game.endRun(); }
                else if (i == 2) { Store.sfxOn = !Store.sfxOn; Sfx.enabled = Store.sfxOn; Store.save(); Game.toast(Store.sfxOn ? "SOUND ON" : "SOUND OFF", 0xFF7CE7FF); }
                else { Game.world.paused = false; Game.gotoMenu(); }
                return;
            }
        }
    };

Game.onBack = function() {
        if (Game.screen == Game.PLAY) {
            if (Game.world.paused) { Game.world.paused = false; Game.endRun(); }
            else Game.world.paused = true;
        } else if (Game.screen == Game.GAMEOVER) Game.gotoMenu();
        else if (Game.screen != Game.MENU) Game.screen = Game.MENU;
        else Game.gv.finishApp();
    };

Game.garageActY = function() { return Game.H * 0.585; }

Game.garageSkinY = function() { return Game.H * 0.745; }

Game.garageSkinSize = function() { return Game.W * 0.108; }

Game.garageUpgY = function() { return Game.H * 0.885; }

Game.garageTap = function(x, y) {
        if (Game.hit(0, 0, Game.W * 0.22, Game.H * 0.085, x, y)) { Game.screen = Game.MENU; return; }
        if (Game.hit(Game.W * 0.02, Game.H * 0.20, Game.W * 0.14, Game.H * 0.14, x, y)) { Game.carPage = (Game.carPage + 5) % 6; return; }
        if (Game.hit(Game.W * 0.84, Game.H * 0.20, Game.W * 0.14, Game.H * 0.14, x, y)) { Game.carPage = (Game.carPage + 1) % 6; return; }
        for (var i = 0; i < 6; i++) {
            var dx = Game.W / 2 + (i - 2.5) * Game.W * 0.085;
            if (Game.hit(dx - Game.W * 0.03, Game.H * 0.385, Game.W * 0.06, Game.H * 0.04, x, y)) { Game.carPage = i; return; }
        }
        var bw = Game.W * 0.72, bl = (Game.W - bw) / 2, bh = Game.H * 0.078;
        if (Game.hit(bl, Game.garageActY(), bw, bh, x, y)) {
            var car = Store.CARS[Game.carPage];
            if (Store.unlocked[Game.carPage]) {
                if (Store.selectedCar != Game.carPage) {
                    Store.selectedCar = Game.carPage;
                    Store.save();
                    Sfx.buySfx();
                    Game.toast("CAR SELECTED", 0xFF7CFF6B);
                } else Game.startRun();
            } else if (Store.coins >= car.price) {
                Store.coins -= car.price;
                Store.unlocked[Game.carPage] = true;
                Store.selectedCar = Game.carPage;
                Store.save();
                Sfx.levelUpPlay();
                Game.gv.haptic(20);
                Game.burstConfetti(Game.W * 0.5, Game.H * 0.35, 40);
                Game.toast(car.name + " UNLOCKED!", 0xFF00E5FF);
            } else Game.toast("NOT ENOUGH COINS", 0xFFFF6B6B);
            return;
        }
        var size = Game.garageSkinSize(), gap = Game.W * 0.012;
        var sl = (Game.W - (6 * size + 5 * gap)) / 2;
        for (var k = 0; k < 6; k++) {
            var sx = sl + k * (size + gap);
            if (Game.hit(sx, Game.garageSkinY(), size, size, x, y)) {
                var idx = Game.carPage * 3 + k;
                if (Store.skinOwned[idx]) {
                    if (Store.selectedSkin != idx) { Store.selectedSkin = idx; Store.save(); Sfx.clickSfx(); }
                } else if (Store.coins >= Store.SKIN_PRICE[Game.carPage]) {
                    Store.coins -= Store.SKIN_PRICE[Game.carPage];
                    Store.skinOwned[idx] = true;
                    Store.selectedSkin = idx;
                    Store.save();
                    Sfx.buySfx();
                    Game.toast("PAINT UNLOCKED", 0xFFB78CFF);
                } else Game.toast("NOT ENOUGH COINS", 0xFFFF6B6B);
                return;
            }
        }
        var uw = (Game.W - Game.W * 0.10 - 3 * Game.W * 0.028) / 4;
        for (var i = 0; i < 4; i++) {
            var ux = Game.W * 0.05 + i * (uw + Game.W * 0.028);
            if (Game.hit(ux, Game.garageUpgY() - Game.H * 0.042, uw, Game.H * 0.092, x, y)) {
                if (Store.upg(i) >= Store.UPG_MAX[i]) { Game.toast("MAX LEVEL", 0xFF00E5FF); return; }
                var cost = Store.upgCost(i);
                if (Store.coins < cost) { Game.toast("NOT ENOUGH COINS", 0xFFFF6B6B); return; }
                Store.coins -= cost;
                if (i == 0) Store.upgSpeed++;
                else if (i == 1) Store.upgNitro++;
                else if (i == 2) Store.upgMagnet++;
                else Store.upgArmor++;
                Store.save();
                Sfx.buySfx();
                Game.gv.haptic(14);
                Game.toast("UPGRADED!", 0xFF7CFF6B);
                return;
            }
        }
    };

Game.missionRowY = function(i) { return Game.H * 0.158 + i * Game.H * 0.0805; }

Game.missionRowH = function() { return Game.H * 0.0725; }

Game.dailyY = function() { return Game.H * 0.742; }

Game.missionTap = function(x, y) {
        if (Game.hit(0, 0, Game.W * 0.22, Game.H * 0.085, x, y)) { Game.screen = Game.MENU; return; }
        var l = Game.W * 0.05, w = Game.W * 0.90, h = Game.missionRowH();
        for (var i = 0; i < 7; i++) {
            var ry = Game.missionRowY(i);
            if (Game.hit(l + w - Game.W * 0.25, ry, Game.W * 0.24, h, x, y)) {
                if (Store.claimed[i] <= Store.bestMission[i]) {
                    var rew = Game.missionReward(i);
                    Store.claimed[i] = Store.bestMission[i] + 1;   // re-arms when the next tier is reached
                    Store.coins += rew;
                    Store.totalCoinsEarned += rew;
                    Store.save();
                    Sfx.buySfx();
                    Game.burstConfetti(l + w * 0.86, ry + h / 2, 18);
                    Game.toast("+" + rew + " COINS", 0xFFFFD24D);
                }
                return;
            }
        }
        var dw = (w - Game.W * 0.04) / 3;
        for (var i = 0; i < 3; i++) {
            var dx = l + i * (dw + Game.W * 0.02);
            if (Game.hit(dx, Game.dailyY(), dw, Game.H * 0.12, x, y)) {
                if (Game.dailyDone[i] && !Game.dailyClaimed[i] && Game.dailyEarn[i] >= Game.DAILY_GOAL[i]) {
                    Game.dailyClaimed[i] = true;
                    Store.coins += Game.DAILY_REW[i];
                    Store.totalCoinsEarned += Game.DAILY_REW[i];
                    Store.save();
                    Sfx.buySfx();
                    Game.toast("+" + Game.DAILY_REW[i] + " COINS", 0xFFFFD24D);
                }
                return;
            }
        }
    };

Game.setRowY = function(i) { return Game.H * 0.175 + i * Game.H * 0.104; }

Game.settingsTap = function(x, y) {
        if (Game.hit(0, 0, Game.W * 0.22, Game.H * 0.085, x, y)) { Game.screen = Game.MENU; return; }
        var l = Game.W * 0.05, w = Game.W * 0.90, h = Game.H * 0.084;
        for (var i = 0; i < 4; i++) {
            if (Game.hit(l, Game.setRowY(i), w, h, x, y)) {
                if (i == 0) { Store.sfxOn = !Store.sfxOn; Sfx.enabled = Store.sfxOn; }
                else if (i == 1) { Store.musicOn = !Store.musicOn; Music.setEnabled(Store.musicOn); }
                else if (i == 2) Store.hapticsOn = !Store.hapticsOn;
                else { Store.quality = Store.quality > 0.5 ? 0.5 : 1; Game.gv.applyQuality(); }
                Store.save();
                Sfx.clickSfx();
                return;
            }
        }
        if (Game.hit(l, Game.setRowY(4) + Game.H * 0.01, w, h, x, y)) { Game.resetProgress(); return; }
        if (Game.hit(l, Game.setRowY(4) + Game.H * 0.01 + h + Game.H * 0.016, w, h, x, y)) { Game.screen = Game.CREDITS; }
    };

Game.resetProgress = function() {
        Store.coins = 500;
        Store.bestDist = 0;
        Store.totalDist = 0;
        Store.totalCoinsEarned = 0;
        Store.runCount = 0;
        Store.selectedCar = 0;
        Store.upgSpeed = 0;
        Store.upgNitro = 0;
        Store.upgMagnet = 0;
        Store.upgArmor = 0;
        for (var i = 0; i < 6; i++) { Store.unlocked[i] = i == 0; Store.stars[i] = 0; }
        for (var i = 0; i < 7; i++) { Store.bestMission[i] = 0; Store.claimed[i] = 0; }
        for (var i = 0; i < 18; i++) Store.skinOwned[i] = i < 6;
        Store.selectedSkin = 0;
        Store.save();
        Game.toast("PROGRESS RESET", 0xFFFF6B6B);
    };

Game.endRun = function() {
        if (Game.screen == Game.GAMEOVER) return;
        Store.runCount++;
        Store.coins += Game.world.totalEarned;
        Store.totalCoinsEarned += Game.world.totalEarned;
        Store.totalDist += Game.world.meters;
        if (Game.world.meters > Store.bestDist) Store.bestDist = Game.world.meters;
        var add = [Game.world.meters, Game.world.passRun + Game.world.nearRun, Game.world.coinRun,
                Game.world.nearRun, Game.world.nitroUses, Game.world.coinRun, Game.world.score];
        for (var i = 0; i < 7; i++) {
            while (add[i] >= Store.missionTarget(i)) Store.bestMission[i]++;
        }
        Game.dailyEarn[0] += Game.world.meters;
        Game.dailyEarn[1] += Game.world.passRun + Game.world.nearRun;
        Game.dailyEarn[2] += Game.world.coinRun;
        for (var i = 0; i < 3; i++) if (Game.dailyEarn[i] >= Game.DAILY_GOAL[i]) Game.dailyDone[i] = true;
        Store.totalPassed += Game.world.passRun + Game.world.nearRun;
        Store.totalNearMiss += Game.world.nearRun;
        Store.totalNitro += Game.world.nitroUses;
        Store.totalScore += Game.world.score;
        for (var i = 0; i < 3; i++) if (Game.dailyEarn[i] >= Game.DAILY_GOAL[i]) Game.dailyDone[i] = true;
        Store.save();
        Game.screen = Game.GAMEOVER;
        Music.setEnabled(Store.musicOn);
    };

Game.gotoMenu = function() {
        Game.goMenuAfter = false;
        Game.screen = Game.MENU;
        Music.setEnabled(Store.musicOn);
        Sfx.setEngine(0, 0);
    };

Game.onRunOver = function() {
        if (Game.screen == Game.PLAY) {
            Game.gv.haptic(200);
            Game.gv.postDelayedAction(function(){ this.onRunOverDelay(); }, 950);
        }
    };

Game.onRunOverDelay = function() {
        if (Game.screen == Game.PLAY) Game.endRun();
    };

Game.overBtnY = function(i) { return Game.H * 0.545 + i * Game.H * 0.096; }

Game.overTap = function(x, y) {
        var bw = Game.W * 0.78, bl = (Game.W - bw) / 2, bh = Game.H * 0.076;
        if (!Game.goMenuAfter && Game.hit(bl, Game.overBtnY(0), bw, bh, x, y)) {
            Store.coins += Game.world.totalEarned;
            Store.totalCoinsEarned += Game.world.totalEarned;
            Store.save();
            Game.burstConfetti(Game.W / 2, Game.H * 0.5, 30);
            Game.toast("+" + Draw.fmt(Game.world.totalEarned) + " BONUS COINS", 0xFFFFD24D);
            Game.goMenuAfter = true;
            return;
        }
        if (Game.hit(bl, Game.overBtnY(1), bw, bh, x, y)) { Game.startRun(); return; }
        if (Game.hit(bl, Game.overBtnY(2), bw, bh, x, y)) Game.gotoMenu();
    };

Game.hit = function(l, top, w, h, x, y) {
        return x >= l && x <= l + w && y >= top && y <= top + h;
    };

Game.toast = function(s, col) { Game.toast = s; Game.toastT = 1.7; Game.toastCol = col; }

Game.burstConfetti = function(x, y, n) {
        for (var i = 0; i < n; i++) {
            var f = new Array(5).fill(0);
            f[0] = x;
            f[1] = y;
            f[2] = (rnd.nextFloat() - 0.5) * 720;
            f[3] = (rnd.nextFloat() - 0.8) * 820;
            f[4] = 0.6 + rnd.nextFloat() * 0.7;
            Game.fx.push(f);
        }
    };

Game.draw = function(c) {
        if (Game.screen == Game.PLAY || Game.screen == Game.GAMEOVER) {
            var sh = Game.world.crashShake * 16;
            c.save();
            if (sh > 0.3) c.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
            Game.world.draw(c);
            c.restore();
            Game.drawHud(c);
            if (Game.world.paused) Game.drawPause(c);
            if (Game.screen == Game.GAMEOVER) Game.drawGameOver(c);
        } else if (Game.screen == Game.MENU) Game.drawMenu(c);
        else if (Game.screen == Game.GARAGE) Game.drawGarage(c);
        else if (Game.screen == Game.MISSIONS) Game.drawMissions(c);
        else if (Game.screen == Game.SETTINGS) Game.drawSettings(c);
        else Game.drawCredits(c);
        Game.drawFx(c);
        Game.drawToast(c);
    };

Game.drawFx = function(c) {
        for (var i = 0; i < Game.fx.length; i++) {
            var f = Game.fx[i];
            var col = f[2] > 0 ? 0xFF00E5FF : 0xFFFF2E97;
            Draw.rrect(c, f[0] - 4, f[1] - 4, f[0] + 4, f[1] + 4, 2, Draw.alpha(col, Math.trunc((255 * Math.min(1, f[4])))));
        }
    };

Game.drawToast = function(c) {
        if (Game.toastT <= 0 || Game.toast == null) return;
        var a = Math.min(1, Game.toastT * 2);
        var tw = Math.min(Game.W * 0.9, Draw.measure(Game.toast, Game.W * 0.040, Draw.F_BOLD) + Game.W * 0.10);
        var x = Game.W / 2 - tw / 2, y = Game.H * 0.115;
        Draw.rrect(c, x, y, x + tw, y + Game.H * 0.052, Game.H * 0.026, Draw.alpha(0xFF0B1020, Math.trunc((230 * a))));
        Draw.rrectStroke(c, x, y, x + tw, y + Game.H * 0.052, Game.H * 0.026, Draw.alpha(Game.toastCol, Math.trunc((210 * a))), 2);
        Draw.text(c, Game.toast, Game.W / 2, y + Game.H * 0.035, Game.W * 0.038, Draw.F_BOLD, Draw.alpha(0xFFFFFFFF, Math.trunc((255 * a))), CENTER);
    };

Game.drawBackground = function(c, neon) {
        Draw.sh(new RadialGradient2(Game.W * 0.5, Game.H * 0.34, Game.H * 0.95, 0xFF141B3A, 0xFF05070F, 'clamp'));
        Draw.p.setStyle('fill');
        c.drawRect(0, 0, Game.W, Game.H, Draw.p);
        Draw.shClear();
        var hy = Game.H * 0.56;
        Draw.s.setStyle('stroke');
        Draw.s.setShader(null);
        Draw.s.setStrokeWidth(1.5);
        for (var i = -9; i <= 9; i++) {
            Draw.s.setColor(Draw.alpha(neon, 24));
            c.drawLine(Game.W / 2 + i * Game.W * 0.13, Game.H, Game.W / 2 + i * Game.W * 0.013, hy, Draw.s);
        }
        for (var i = 0; i < 12; i++) {
            var f = Math.pow((i + (Game.t * 0.30) % 1) / 12, 2.2);
            var y = hy + (Game.H - hy) * f;
            Draw.s.setColor(Draw.alpha(neon, Math.trunc((14 + 42 * f))));
            c.drawLine(0, y, Game.W, y, Draw.s);
        }
        for (var i = 0; i < 44; i++) {
            var sx = (i * 97.13) % Game.W;
            var sy = (i * 53.7) % (hy * 0.8);
            Draw.p.setColor(Draw.alpha(0xFFFFFFFF, Math.trunc((36 + 60 * Math.abs(Math.sin(Game.t * 0.8 + i))))));

            Draw.rrect(c, sx + size * 0.30, Game.garageSkinY() + size * 0.64, sx + size * 0.70, Game.garageSkinY() + size * 0.70, 2, cols[2]);
            if (sel) Draw.glowRRect(c, sx - 2, Game.garageSkinY() - 2, sx + size + 2, Game.garageSkinY() + size + 2, size * 0.24, 0xFF7CFF6B, 2.4);
            else if (owned) Draw.rrectStroke(c, sx, Game.garageSkinY(), sx + size, Game.garageSkinY() + size, size * 0.22, 0x55FFFFFF, 1.4);
            if (!owned) {
                Draw.rrect(c, sx, Game.garageSkinY(), sx + size, Game.garageSkinY() + size, size * 0.22, 0xB005070C);
                Draw.iconCoin(c, sx + size / 2, Game.garageSkinY() + size * 0.38, size * 0.17, Game.t * 3, 0);
                Draw.text(c, Draw.fmt2(Store.SKIN_PRICE[Game.carPage]), sx + size / 2, Game.garageSkinY() + size * 0.74, size * 0.24, Draw.F_BOLD, 0xFFFFD24D, CENTER);

        var uy = Game.garageUpgY();
        Draw.textLS(c, "UPGRADES", Game.W * 0.05, uy - Game.H * 0.055, Game.W * 0.024, Draw.F_SEMI, 0xFF7A8DA8, LEFT, 0.2);
        for (var i = 0; i < 4; i++) {

            var lv = Store.upg(i);
            var max = lv >= Store.UPG_MAX[i];
            Draw.rrect(c, ux, uy - Game.H * 0.042, ux + uw, uy + Game.H * 0.050, Game.H * 0.016, 0xCC0C1424);
            Draw.rrectStroke(c, ux, uy - Game.H * 0.042, ux + uw, uy + Game.H * 0.050, Game.H * 0.016, max ? 0x887CFF6B : 0x55FFFFFF, 1.4);
            Draw.text(c, un[i], ux + uw / 2, uy - Game.H * 0.020, Game.W * 0.022, Draw.F_SEMI, 0xFF9FB2C8, CENTER);
            for (var k = 0; k < 10; k++) {
                var pxx = ux + uw * 0.10 + k * uw * 0.081;
                Draw.rrect(c, pxx, uy - Game.H * 0.010, pxx + uw * 0.055, uy + Game.H * 0.002, 1.5, k < lv ? 0xFF00E5FF : 0x33FFFFFF);

                        Store.coins >= Store.upgCost(i) ? 0xFFFFD24D : 0xFF7A6A4A, CENTER);

        }

Game.drawMissions = function(c) {
        Game.drawBackground(c, 0xFFFF2E97);
        Game.drawTopBar(c, "MISSIONS");
        Draw.textLS(c, "ENDLESS CONTRACTS · EVERY TIER GROWS", Game.W / 2, Game.H * 0.108, Game.W * 0.022, Draw.F_SEMI, 0xFF7A8DA8, CENTER, 0.14);
        var l = Game.W * 0.05, w = Game.W * 0.90, h = Game.missionRowH();
        var cols = [0xFF00E5FF, 0xFFFF2E97, 0xFFFFD24D, 0xFFA65CFF, 0xFFFF7A1A, 0xFF7CFF6B, 0xFF7CE7FF];
        for (var i = 0; i < 7; i++) {
            var ry = Game.missionRowY(i);
            var tier = Store.bestMission[i];
            var claimable = Game.missionClaimable(i);
            var tgt = Store.missionTarget(i);
            var cur = Math.min(tgt, Game.previewProgress(i));
            Draw.rrect(c, l, ry, l + w, ry + h, Game.H * 0.016, claimable ? 0xCC10233A : 0xCC0C1424);
            Draw.rrectStroke(c, l, ry, l + w, ry + h, Game.H * 0.016, claimable ? cols[i] : 0x2EFFFFFF, claimable ? 2 : 1.2);
            Draw.rrect(c, l + w * 0.018, ry + h * 0.16, l + w * 0.018 + h * 0.60, ry + h * 0.84, h * 0.15,
                    Draw.alpha(cols[i], claimable ? 70 : 30));
            Draw.text(c, "" + (tier + 1), l + w * 0.018 + h * 0.30, ry + h * 0.62, h * 0.28, Draw.F_HEAD, cols[i], CENTER);
            Draw.text(c, Store.M_NAMES[i], l + w * 0.115, ry + h * 0.31, Game.W * 0.033, Draw.F_BOLD,
                    claimable ? 0xFFFFFFFF : 0xFF9FB2C8, LEFT);
            var prog = Store.M_DESC[i].replace("%s", Draw.fmt(tgt)) + "  (" + Draw.fmt(cur) + ")";
            Draw.text(c, prog, l + w * 0.115, ry + h * 0.585, Game.W * 0.0225, Draw.F_MED, 0xFF8EA3BC, LEFT);
            Draw.rrect(c, l + w * 0.115, ry + h * 0.70, l + w * 0.66, ry + h * 0.775, 3, 0x2EFFFFFF);
            var f = Draw.clamp(cur / tgt, 0, 1);
            if (f > 0.01) Draw.rrect(c, l + w * 0.115, ry + h * 0.70, l + w * 0.115 + w * 0.545 * f, ry + h * 0.775, 3, cols[i]);
            if (claimable) {
                Draw.rrect(c, l + w - Game.W * 0.235, ry + h * 0.24, l + w - Game.W * 0.018, ry + h * 0.76, h * 0.26, 0xFF14301F);
                Draw.rrectStroke(c, l + w - Game.W * 0.235, ry + h * 0.24, l + w - Game.W * 0.018, ry + h * 0.76, h * 0.26, 0xFF7CFF6B, 1.8);
                Draw.text(c, "+" + Game.missionReward(i), l + w - Game.W * 0.126, ry + h * 0.59, Game.W * 0.030, Draw.F_BOLD, 0xFF7CFF6B, CENTER);

                Draw.rrect(c, l + w - Game.W * 0.20, ry + h * 0.28, l + w - Game.W * 0.018, ry + h * 0.72, h * 0.22, 0x1FFFFFFF);
                Draw.text(c, "T" + (tier + 1), l + w - Game.W * 0.109, ry + h * 0.58, Game.W * 0.026, Draw.F_BOLD, 0xFF7A8DA8, CENTER);

        Draw.text(c, Store.streak > 0 ? ("STREAK " + Store.streak + " DAYS") : "PLAY TODAY TO START A STREAK",
                l + w, dy - Game.H * 0.014, Game.W * 0.022, Draw.F_SEMI, 0xFF7A8DA8, RIGHT);
        var dw = (w - Game.W * 0.04) / 3;

        for (var i = 0; i < 3; i++) {
            var dx = l + i * (dw + Game.W * 0.02);
            var done = Game.dailyEarn[i] >= Game.DAILY_GOAL[i];
            var claimed = Game.dailyClaimed[i];
            Draw.rrect(c, dx, dy, dx + dw, dy + Game.H * 0.105, Game.H * 0.016, done && !claimed ? 0xCC16281C : 0xCC0C1424);
            Draw.rrectStroke(c, dx, dy, dx + dw, dy + Game.H * 0.105, Game.H * 0.016, done && !claimed ? 0xFF7CFF6B : 0x2EFFFFFF, 1.4);
            Draw.text(c, dn[i], dx + dw / 2, dy + Game.H * 0.026, Game.W * 0.023, Draw.F_BOLD, 0xFF9FB2C8, CENTER);
            Draw.text(c, Draw.fmt2(Math.min(Game.DAILY_GOAL[i], Game.dailyEarn[i])) + " / " + Draw.fmt2(Game.DAILY_GOAL[i]),
                    dx + dw / 2, dy + Game.H * 0.052, Game.W * 0.028, Draw.F_BOLD, 0xFFFFFFFF, CENTER);
            var f = Draw.clamp(Game.dailyEarn[i] / Game.DAILY_GOAL[i], 0, 1);
            Draw.rrect(c, dx + dw * 0.10, dy + Game.H * 0.062, dx + dw * 0.90, dy + Game.H * 0.068, 3, 0x2EFFFFFF);
            if (f > 0.02) Draw.rrect(c, dx + dw * 0.10, dy + Game.H * 0.062, dx + dw * 0.10 + dw * 0.80 * f, dy + Game.H * 0.068, 3, 0xFFFFD24D);
            if (claimed) Draw.text(c, "CLAIMED", dx + dw / 2, dy + Game.H * 0.092, Game.W * 0.022, Draw.F_BOLD, 0xFF6A7A8A, CENTER);
            else if (done) Draw.text(c, "TAP +" + Game.DAILY_REW[i], dx + dw / 2, dy + Game.H * 0.092, Game.W * 0.024, Draw.F_BOLD, 0xFF7CFF6B, CENTER);
            else Draw.text(c, "+" + Game.DAILY_REW[i], dx + dw / 2, dy + Game.H * 0.092, Game.W * 0.022, Draw.F_SEMI, 0xFF8FA3C0, CENTER);
        }
    };

Game.previewProgress = function(i) {
        switch (i) {
            case 0: return Store.totalDist;
            case 1: return Store.totalPassed;
            case 2: return Store.totalCoinsEarned;
            case 3: return Store.totalNearMiss;
            case 4: return Store.totalNitro;
            case 5: return Store.totalCoinsEarned;
            default: return Store.totalScore;
        }
    };

Game.missionReward = function(i) {
        return Store.M_REWARD[i] + Store.M_REWARD[i] * Store.bestMission[i] / 2;
    };

Game.missionClaimable = function(i) { return Store.claimed[i] <= Store.bestMission[i]; }

(function(){

    var vw = window.innerWidth, vh = window.innerHeight;
    var targetAR = 9/19.5;
    var w, h;
    if (vw / vh > targetAR){ h = vh; w = h*targetAR; } else { w = vw; h = w/targetAR; }
    var dpr = Math.min(window.devicePixelRatio||1, 2.2);
    cv.style.width = w+'px'; cv.style.height = h+'px';
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cv._logicalW = w; cv._logicalH = h;

    if (!dragged && dt<520) game.onTap(p.x,p.y);
  }
  cv.addEventListener('pointerup', function(e){ up(e); });
  cv.addEventListener('pointercancel', function(){ activeId=null; });
  window.addEventListener('keydown', function(e){
    if (e.key==='ArrowLeft') game.onTap(game.W*0.15, game.H*0.5);
    if (e.key==='ArrowRight') game.onTap(game.W*0.85, game.H*0.5);
    if (e.key===' ' && game.screen===Game.PLAY) { game.fireNitro(); }
    if (e.key==='p' && game.screen===Game.PLAY) game.world.paused = !game.world.paused;
    if (e.key==='Escape') game.onBack();
  });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ Store.save(); Music.stop(); Sfx.setEngine(0,0); }
    else if (Store.musicOn) Music.setEnabled(true);
  });
  setInterval(function(){ Store.save(); }, 5000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
